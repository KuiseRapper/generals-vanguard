# The Flatpak of Generals Vanguard (Tools/linux-packages.sh builds it with flatpak-builder and packs it as one
# .flatpak file with flatpak build-bundle).  It packages the portable folder Tools/linux-portable.sh --no-art
# made and checked, which linux-packages.sh puts beside this file, in /app/lib/generals-vanguard: the game
# finds its overlay from its own executable's place, as it does from /usr/lib in the other packages.
#
# No filesystem permission: the sandbox sees none of the player's folders, so the first start asks for the Zero
# Hour folder through the desktop portal's folder chooser (SDL's dialog uses it inside a Flatpak), and only
# the folder chosen is shared with it; a Zero Hour without its base game beside it is followed by a second
# question, for the Generals folder.  Network: LAN games.  device=all: the GPU.
app-id: io.github.kuiserapper.GeneralsVanguard
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: generals-vanguard
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --socket=pulseaudio
  - --device=all
  - --share=network
modules:
  - name: generals-vanguard
    buildsystem: simple
    sources:
      - type: dir
        path: GeneralsVanguard-linux-x86_64
        dest: folder
      - type: file
        path: io.github.kuiserapper.GeneralsVanguard.metainfo.xml
    build-commands:
      - install -d /app/lib/generals-vanguard /app/bin /app/share/applications /app/share/metainfo
          /app/share/icons/hicolor/48x48/apps /app/share/icons/hicolor/128x128/apps
      - cp -a folder/. /app/lib/generals-vanguard/
      - rm -rf /app/lib/generals-vanguard/bin/generals.debug /app/lib/generals-vanguard/share/applications
          /app/lib/generals-vanguard/share/icons
      - ln -s ../lib/generals-vanguard/generals-vanguard.sh /app/bin/generals-vanguard
      - sed -e 's/^Exec=.*/Exec=generals-vanguard/' -e 's/^Icon=.*/Icon=io.github.kuiserapper.GeneralsVanguard/'
          -e '/^# a template/d' folder/share/applications/generals-vanguard.desktop
          > /app/share/applications/io.github.kuiserapper.GeneralsVanguard.desktop
      - install -m 644 folder/share/icons/hicolor/48x48/apps/generals-vanguard.png
          /app/share/icons/hicolor/48x48/apps/io.github.kuiserapper.GeneralsVanguard.png
      - install -m 644 folder/share/icons/hicolor/128x128/apps/generals-vanguard.png
          /app/share/icons/hicolor/128x128/apps/io.github.kuiserapper.GeneralsVanguard.png
      - install -m 644 io.github.kuiserapper.GeneralsVanguard.metainfo.xml /app/share/metainfo/

; The static half of Russia's air denial.  The Patriot's launcher is the placeholder model and
; weapon until the S-300 pass; the point now is that the side has a base defence at all, which every
; shipped side does and the AI asks its SideInfo for.
ObjectReskin RussiaSAM AmericaPatriotBattery
End

Object RussiaSAM
  Side        = Russia
  DisplayName = OBJECT:RussiaSAM
  SelectPortrait = RUSAM
  BuildCost   = 1000
  CommandSet  = RussiaSAMCommandSet
  Prerequisites
    Object = RussiaThermalPowerPlant
  End
  ; The Patriot's copied set is ground-primary, air-tertiary, which made the S-300 a
  ; multi-role gun.  A patch set with the same conditions keeps only the anti-air slot.
  WeaponSet
    Conditions = None
    Weapon = TERTIARY PatriotMissileWeaponAir
    ShareWeaponReloadTime = Yes
  End
End


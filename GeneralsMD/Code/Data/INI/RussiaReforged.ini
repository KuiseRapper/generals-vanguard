; Russia's objects, loaded after FixesReforged.ini with INI_LOAD_MULTIFILE.
;
; Every Russian object is an ObjectReskin of an existing template, followed by a patch block on the
; new name: the reskin copies the source whole (model, draw, voices) and the patch makes it Russian.
; Stage one is two objects, enough for the fourth-side spike; the roster follows in stage two.
;
; This file lands in the multiplayer INI checksum.

ObjectReskin RussiaCommandBunker ChinaCommandCenter
End

Object RussiaCommandBunker
  Side        = Russia
  DisplayName = OBJECT:RussiaCommandBunker
End

ObjectReskin RussiaSapery ChinaVehicleDozer
End

Object RussiaSapery
  Side        = Russia
  DisplayName = OBJECT:RussiaSapery
End

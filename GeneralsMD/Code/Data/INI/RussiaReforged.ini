  BuildCost   = 1600
  Prerequisites
    Object = RussiaMobilizationPlant
    Object = RussiaFireDirectionCenter
  End
  ; ERA/Shtora: explosive reactive armour, a health pool rather than a new armour type until the
  ; stat pass can separate the two.  AddModule, for the same reason as the Igla above.
  AddModule
    Behavior = MaxHealthUpgrade ModuleTag_RussiaERAShtora
      TriggeredBy = Upgrade_RussiaERAShtora
      AddMaxHealth = 400
      ChangeType = ADD_CURRENT_HEALTH_TOO
    End
  End
End


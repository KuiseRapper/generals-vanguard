End

Object RussiaSupplyCenter
  Side        = Russia
  DisplayName = OBJECT:RussiaSupplyCenter
  BuildCost   = 1000
  CommandSet  = RussiaSupplyCenterCommandSet
  Prerequisites
    Object = RussiaThermalPowerPlant
  End
End


; Russia's objects, loaded after FixesReforged.ini with INI_LOAD_MULTIFILE.
;
; Every Russian object is an ObjectReskin of an existing template, followed by a patch block on the
; new name: the reskin copies the source whole (model, draw, weapons, voices) and the patch makes it
; Russian - side, name, cost, command set.  This is the skeleton: the source models are placeholders
; and the source weapons are borrowed by name; the stat and silhouette pass comes later.
;
; This file lands in the multiplayer INI checksum.

; ==== Buildings ===================================================================================


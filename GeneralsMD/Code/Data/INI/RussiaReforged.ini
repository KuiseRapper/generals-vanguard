; The air arm.  The design used to say "no air force"; the owner's revision is a small one -
; an interceptor and an attack helicopter - so the side still leans on guns and ground armour.
; The Raptor model is the interceptor placeholder because the shipped MiG carries napalm, not
; air-to-air missiles; the Helix model is the helicopter placeholder.

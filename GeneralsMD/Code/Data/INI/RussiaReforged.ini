; The supply truck is what turns a supply centre into money.  Without one Russia can put the
; centre up and earn nothing at all, which is exactly what a measured match did before this
; object existed.
ObjectReskin RussiaSupplyTruck ChinaVehicleSupplyTruck
End

Object RussiaSupplyTruck
  Side        = Russia
  DisplayName = OBJECT:RussiaSupplyTruck
  BuildCost   = 600
  Prerequisites

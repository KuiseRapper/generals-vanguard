ObjectReskin RussiaMotostrelki ChinaInfantryRedguard
End

Object RussiaMotostrelki
  Side        = Russia
  DisplayName = OBJECT:RussiaMotostrelki
  SelectPortrait = RUMotostrelki
  BuildCost   = 300
  Prerequisites
    Object = RussiaRegimentalDepot
  End
  ; Igla: the squad keeps its rifle and gains an anti-aircraft missile.  The Stinger is a
  ; placeholder for the Igla launcher until the art and weapon pass.  AddModule, not a bare
  ; Behavior, so the reskin keeps the modules it copied: a restated module clears every copied
  ; module sharing its interface (port defect 34).
  AddModule
    Behavior = WeaponSetUpgrade ModuleTag_RussiaIgla
      TriggeredBy = Upgrade_RussiaIgla
    End
  End
  WeaponSet
    Conditions = PLAYER_UPGRADE
    Weapon = PRIMARY RedguardMachineGun
    Weapon = SECONDARY StingerMissileWeapon
    AutoChooseSources = PRIMARY FROM_PLAYER FROM_SCRIPT FROM_AI DEFAULT_SWITCH_WEAPON
    AutoChooseSources = SECONDARY FROM_PLAYER FROM_SCRIPT FROM_AI
  End
  AddModule
    Behavior = MaxHealthUpgrade ModuleTag_RussiaInfantryTraining
      TriggeredBy = Upgrade_RussiaInfantryTraining
      AddMaxHealth = 100
      ChangeType = ADD_CURRENT_HEALTH_TOO
    End
  End
  AddModule
    Behavior = MaxHealthUpgrade ModuleTag_RussiaCommandDoctrine
      TriggeredBy = Upgrade_RussiaCommandDoctrine
      AddMaxHealth = 100
      ChangeType = ADD_CURRENT_HEALTH_TOO
    End
  End
End


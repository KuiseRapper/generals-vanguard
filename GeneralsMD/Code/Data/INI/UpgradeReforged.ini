; Zero Hour Reforged upgrade fixes, loaded after Upgrade.ini. An upgrade named here is edited in
; place, so a block holds only the fields that change.
;
; This file lands in the multiplayer INI checksum.

; EVA has a line for each of these three and nothing plays it: the upgrade names no ResearchSound
; and falls back to the generic "upgrade complete".

Upgrade Upgrade_AmericaMOAB
  ResearchSound = EvaUSA_UpgradeMoab
End

Upgrade Upgrade_AmericaSentryDroneGun
  ResearchSound = EvaUSA_UpgradeSentryDrone
End

Upgrade Upgrade_ChinaNeutronShells
  ResearchSound = EvaChina_UpgradeNeutronShell
End

; Russia's first upgrade tier.  A player upgrade applies to every unit of the type the player
; already owns and to every one built afterwards; the object's WeaponSetUpgrade or MaxHealthUpgrade
; names it in TriggeredBy.  Bought from the Regimental Depot and the Tank Works.

Upgrade Upgrade_RussiaIgla
  DisplayName  = UPGRADE:RussiaIgla
  BuildTime    = 20.0
  BuildCost    = 1000
  ButtonImage  = SSFlashbang
End

Upgrade Upgrade_RussiaERAShtora
  DisplayName  = UPGRADE:RussiaERAShtora
  BuildTime    = 30.0
  BuildCost    = 1500
  ButtonImage  = SSNationalism
End

; The rest of Russia's upgrade tier.  Each is a player upgrade bought from the building that
; delivers it; the object modules name it in TriggeredBy.

Upgrade Upgrade_RussiaInfantryTraining
  DisplayName  = UPGRADE:RussiaInfantryTraining
  BuildTime    = 20.0
  BuildCost    = 800
  ButtonImage  = SSNationalism
End

Upgrade Upgrade_RussiaAircraftArmor
  DisplayName  = UPGRADE:RussiaAircraftArmor
  BuildTime    = 25.0
  BuildCost    = 1000
  ButtonImage  = SSMigArmor
End

Upgrade Upgrade_RussiaArtilleryTraining
  DisplayName  = UPGRADE:RussiaArtilleryTraining
  BuildTime    = 30.0
  BuildCost    = 1200
  ButtonImage  = SSArtilleryTraining
End

; Russia's own weapons, loaded right after WeaponReforged.ini and before any object names one.
;
; They live here rather than in WeaponReforged.ini because every weapon in this file names a
; projectile, and the unit test that parses WeaponReforged.ini on its own has no projectile store:
; a weapon with ProjectileObject in that file aborted the test.  That file also has to stay
; parseable by a mod whose Weapon.ini lacks EA's weapons.  This one loads after the stores exist.
;
; This file lands in the multiplayer INI checksum.

; The 2S19 with the artillery-school upgrade.  EA's NukeCannonGun with the radiation field left
; out (the 2S19 fires a conventional heavy shell) and the range and reload improved.
Weapon Russia2S19Gun
  PrimaryDamage           = 400.0
  PrimaryDamageRadius     = 50.0
  SecondaryDamage         = 20.0
  SecondaryDamageRadius   = 60.0
  ScatterRadiusVsInfantry = 30.0
  AttackRange             = 420.0
  MinimumAttackRange      = 150.0
  DamageType              = EXPLOSION
  DeathType               = EXPLODED
  WeaponSpeed             = 200
  ProjectileObject        = NukeCannonShell
  FireFX                  = WeaponFX_NukeCannonMuzzleFlash
  FireSound               = NukeCannonWeapon
  VeterancyFireFX         = HEROIC WeaponFX_HeroicNukeCannonMuzzleFlash
  ProjectileDetonationFX  = WeaponFX_NukeCannon
  RadiusDamageAffects     = SUICIDE SELF ALLIES ENEMIES NEUTRALS NOT_SIMILAR
  DelayBetweenShots       = 8500
  ClipSize                = 0
  ClipReloadTime          = 0
End


; The MiG-25's air-to-air missile.  EA's Raptor missile with the ground attack taken out; the
; borrowed MiG model's napalm set is replaced by a patch set with the same conditions.
Weapon RussiaMiG25Missile
  PrimaryDamage               = 100.0
  PrimaryDamageRadius         = 5.0
  ScatterRadiusVsInfantry     = 10.0
  AttackRange                 = 320.0
  MinimumAttackRange          = 100.0
  AcceptableAimDelta          = 30
  DamageType                  = JET_MISSILES
  DeathType                   = EXPLODED
  WeaponSpeed                 = 1000
  ProjectileObject            = RaptorJetMissile
  ProjectileExhaust           = MissileExhaust
  VeterancyProjectileExhaust  = HEROIC HeroicMissileExhaust
  FireFX                      = None
  FireSound                   = RaptorJetMissileWeapon
  ProjectileDetonationFX      = WeaponFX_JetMissileDetonation
  RadiusDamageAffects         = ALLIES ENEMIES NEUTRALS NOT_SIMILAR
  DelayBetweenShots           = 150
  ClipSize                    = 4
  ClipReloadTime              = 8000
  AutoReloadsClip             = RETURN_TO_BASE
  AntiAirborneVehicle         = Yes
  AntiAirborneInfantry        = No
  AntiGround                  = No
  ShowsAmmoPips               = Yes
End


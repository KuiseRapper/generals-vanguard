; The main menu's top-right logo.  The shipped GeneralsLogo is a region of
; SCSmShellUserInterface512_001.tga, which spells "GENERALS ZERO HOUR" in the retail art and cannot
; be changed without editing that shared atlas.  This points the same mapped image at the fork's own
; wordmark instead.  HandCreated loads after TextureSize_512 and INI_LOAD_OVERWRITE keeps the later
; definition, so this one wins; the texture is named Reforged* so it stays the fork's whatever mod
; is loaded.

MappedImage GeneralsLogo
  Texture = ReforgedGeneralsLogo.tga
  TextureWidth = 768
  TextureHeight = 256
  Coords = Left:0 Top:0 Right:768 Bottom:256
  Status = NONE
End

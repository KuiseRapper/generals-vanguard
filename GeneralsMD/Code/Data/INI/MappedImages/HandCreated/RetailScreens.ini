; The retail Zero Hour screen art, forced back over the mods'.  The mods replace the credits,
; challenge, faction-load and main-menu-ruler images (and the fork used to replace the plates); this
; file names the retail images again so the only change left on a screen is the Vanguard logo.  It
; sits in HandCreated, which loads after TextureSize_512, and INI_LOAD_OVERWRITE keeps this block.
;
; GeneralsLogo is the one deliberate replacement: the retail wordmark is a region of
; SCSmShellUserInterface512_001.tga and cannot be changed without editing that shared atlas, so the
; main menu's logo window draws the attached Vanguard lockup instead.  Everything else is retail.


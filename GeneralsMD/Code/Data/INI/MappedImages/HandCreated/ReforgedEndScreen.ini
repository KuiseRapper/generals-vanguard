; The post-game screen.  Victorious.wnd and Defeat.wnd each draw one mapped image over the whole
; screen; the merged data's are the mods' red plates.  Both are pointed at the fork's own plate
; (Vanguard's wordmark and frame) so the end of a match looks like this game, not the mod it is
; built on.  HandCreated loads after TextureSize_512 and INI_LOAD_OVERWRITE keeps the later block.

MappedImage Victorious
  Texture = ReforgedEndScreen.tga
  TextureWidth = 800
  TextureHeight = 600
  Coords = Left:0 Top:0 Right:800 Bottom:600
  Status = NONE
End

MappedImage Defeated
  Texture = ReforgedEndScreen.tga
  TextureWidth = 800
  TextureHeight = 600
  Coords = Left:0 Top:0 Right:800 Bottom:600
  Status = NONE
End

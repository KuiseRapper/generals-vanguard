; The fork's own factions, loaded after PlayerTemplate.ini with INI_LOAD_MULTIFILE: a name that is
; already there is edited in place, a new one is added after EA's templates.
;
; This file lands in the multiplayer INI checksum.
;
; Russia is a fourth side on the Chinese bodies it borrows, until its own art exists.  It starts with
; its Command Bunker and a Sapery (the builder), which is all the fourth-side spike needs: the
; question it answers is whether a side that is new to the engine starts and finishes a match.

PlayerTemplate FactionRussia
  Side              = Russia
  BaseSide          = China
  PlayableSide      = Yes
  StartMoney        = 0
  PreferredColor    = R:210 G:30 B:30
  DisplayName       = INI:FactionRussia
  ; The Command Bunker inherits China's artillery-barrage special power; these sciences unlock it
  ; (the first is the power's RequiredScience, the other two select its two- and three-wave OCLs).
  IntrinsicSciences = SCIENCE_ArtilleryBarrage1 SCIENCE_ArtilleryBarrage2 SCIENCE_ArtilleryBarrage3
  StartingBuilding  = RussiaCommandBunker
  StartingUnit0     = RussiaSapery
  ScoreScreenImage  = America_ScoreScreen
  LoadScreenImage   = SAFactionLogoPage_US
  LoadScreenMusic   = Load_USA
  ScoreScreenMusic  = Score_USA
  BeaconName        = MultiplayerBeacon
  SideIconImage     = GameinfoAMRCA
  GeneralImage      = USA_Logo
  OldFaction        = No
End

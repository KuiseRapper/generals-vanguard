; The fork's AI data for its own factions, loaded after AIData.ini with INI_LOAD_MULTIFILE.  A
; SideInfo named again is edited, a new one is added; every SkirmishBuildList here is added.
;
; This file lands in the multiplayer INI checksum.

AIData

  SideInfo Russia
    ResourceGatherersEasy     = 2
    ResourceGatherersNormal   = 2
    ResourceGatherersHard     = 2
    BaseDefenseStructure1     = ChinaGattlingCannon
  End

  SkirmishBuildList Russia
    Structure RussiaCommandBunker
      Location = X:501.22 Y:546.25
      Rebuilds = 0
      Angle = -135.00
      InitiallyBuilt = No
      AutomaticallyBuild = Yes
    END
  END

End
